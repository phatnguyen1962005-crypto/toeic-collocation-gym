<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Pattern Gym Pro</title><style>:root{--p:#5b5cf0;--p2:#8b5cf6;--g:#15803d;--r:#b42318;--bg:#f5f7fb;--c:#fff;--t:#182033;--m:#667085;--l:#e5e9f0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 5%,#e9e9ff,transparent 30%),var(--bg);color:var(--t)}main{max-width:1000px;margin:28px auto;padding:0 14px 60px}h1{font-size:clamp(30px,5vw,46px);margin:0 0 7px}.sub{color:var(--m)}button{font:inherit;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:20px 0}.stat,.card{background:var(--c);border:1px solid var(--l);border-radius:18px;box-shadow:0 12px 35px #10182812}.stat{padding:13px}.stat small{color:var(--m)}.stat b{display:block;font-size:22px;margin-top:4px}.tabs,.modes,.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:12px}.btn,.tab{border:1px solid var(--l);background:#fff;border-radius:11px;padding:10px 13px;font-weight:750}.tab.on,.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.soft{background:#eef2ff;color:#4338ca}.card{padding:clamp(18px,4vw,32px)}.panel{display:none}.panel.on{display:block}.bar0{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));width:0;transition:.25s}.top{display:flex;justify-content:space-between;color:var(--m);font-weight:700;font-size:13px}.meaning{font-size:clamp(23px,4vw,34px);font-weight:900;margin:16px 0 7px}.hint{color:var(--m);margin-bottom:16px}.options{display:grid;gap:10px}.opt{width:100%;text-align:left;border:1.5px solid var(--l);background:#fff;border-radius:13px;padding:14px;font-weight:700}.opt:hover{border-color:#aaa8ff}.opt.ok{background:#ecfdf3;border-color:#86efac;color:var(--g)}.opt.bad{background:#fff1f0;border-color:#fda29b;color:var(--r);animation:shake .25s}.opt:disabled{cursor:default}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}.fb{display:none;border-top:1px solid var(--l);margin-top:18px;padding-top:16px}.fb.on{display:block}.formula{font-family:monospace;background:#f7f8fb;border:1px solid var(--l);padding:10px;border-radius:10px;overflow:auto}.next{display:flex;justify-content:flex-end;margin-top:16px}.mark{font-size:20px;width:42px;height:42px;border:1px solid var(--l);background:#fff;border-radius:11px}.mark.on{background:#fffbeb;border-color:#fde68a}.list{display:grid;gap:9px}.item{border:1px solid var(--l);border-radius:12px;padding:13px;background:#fbfcfe}.item small{color:var(--m);line-height:1.55}.badtext{color:var(--r)}.goodtext{color:var(--g)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}.scroll{overflow:auto}.empty{padding:28px;border:1px dashed #cbd1db;border-radius:12px;text-align:center;color:var(--m)}.big{font-size:60px;font-weight:950;text-align:center}.center{text-align:center}.conf{position:fixed;top:-15px;width:9px;height:14px;animation:fall 1.7s linear forwards;pointer-events:none}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(700deg);opacity:.2}}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>Grammar Pattern Gym Pro</h1><div class="sub">20 cấu trúc Writing • VI → EN • đánh dấu • lỗi sai • thống kê • âm thanh • adaptive review</div><section class="stats"><div class="stat"><small>Đúng</small><b id="sc">0</b></div><div class="stat"><small>Sai</small><b id="sw">0</b></div><div class="stat"><small>Accuracy</small><b id="sa">0%</b></div><div class="stat"><small>Streak</small><b id="ss">0</b></div><div class="stat"><small>Đánh dấu</small><b id="sm">0</b></div></section><div class="tabs"><button class="tab on" data-p="quiz">Luyện tập</button><button class="tab" data-p="errors">Lỗi sai</button><button class="tab" data-p="stats">Thống kê</button><button class="tab" data-p="marks">⭐ Đánh dấu</button></div><section id="quiz" class="panel on"><div class="modes" style="margin-bottom:12px"><button class="btn primary mode" data-m="all">Đủ 20</button><button class="btn mode" data-m="wrong">Ôn câu sai</button><button class="btn mode" data-m="weak">Cấu trúc yếu</button><button class="btn mode" data-m="marked">⭐ Đã đánh dấu</button><button class="btn soft" id="sound">🔊 Âm thanh</button></div><div class="card"><div id="qb"><div class="bar0"><div class="bar" id="bar"></div></div><div class="top"><span>VI → EN</span><span id="count"></span></div><div class="meaning" id="meaning"></div><div class="hint" id="hint"></div><div class="row" style="margin-bottom:15px"><button class="mark" id="mark">☆</button><button class="btn" id="skip">Bỏ qua</button></div><div class="options" id="opts"></div><div class="fb" id="fb"><b id="fbt"></b><div class="formula" id="formula"></div><p id="example"></p></div><div class="next"><button class="btn primary" id="next" style="display:none">Câu tiếp →</button></div></div><div id="result" style="display:none"><div class="big" id="score"></div><p class="center sub" id="note"></p><div class="row" style="justify-content:center"><button class="btn primary" id="again">Luyện lại</button><button class="btn" onclick="start('wrong')">Ôn câu sai</button><button class="btn" onclick="start('weak')">Ôn cấu trúc yếu</button></div></div></div></section><section id="errors" class="panel"><div class="card"><div class="row" style="justify-content:space-between"><h2>Sổ lỗi sai</h2><button class="btn" id="clear">Xóa lỗi</button></div><div id="errorList"></div></div></section><section id="stats" class="panel"><div class="card"><h2>Thống kê theo cấu trúc</h2><div class="scroll"><table><thead><tr><th>#</th><th>Cấu trúc</th><th>Đúng</th><th>Sai</th><th>Accuracy</th></tr></thead><tbody id="st"></tbody></table></div></div></section><section id="marks" class="panel"><div class="card"><h2>⭐ Cấu trúc đã đánh dấu</h2><div id="markList"></div></div></section></main><script>const P=[
[1,'Mặc dù / dù cho … nhưng …','Nối hai ý tương phản.','Although / Even though + S + V, S + V','Although the service is convenient, it can be expensive.'],
[2,'Trong khi / trái lại …','Đối chiếu hai ý.','While / Whereas + S + V, S + V','While working from home saves time, working in an office allows better communication.'],
[3,'Nếu … thì có thể / sẽ …','Điều kiện và kết quả.','If + S + V, S + will / can + V','If companies provide flexible schedules, employees can achieve a better work-life balance.'],
[4,'Trừ khi / nếu không …','Gần nghĩa if … not.','Unless + S + V, S + will / may + V','Unless companies improve their services, they may lose customers.'],
[5,'Bằng cách làm gì đó, ai đó có thể …','Giải pháp → lợi ích.','By + V-ing, S + can + V','By using public transportation, people can reduce transportation costs.'],
[6,'Cho phép / tạo điều kiện cho ai làm gì','Giúp người khác thực hiện hành động.','S + allow / enable + O + to V','Technology allows employees to work remotely.'],
[7,'Làm cho việc ai đó làm gì trở nên + tính từ','Diễn đạt tác động.','S + make it + adjective + for O + to V','The Internet makes it easier for people to access information.'],
[8,'Thật + tính từ + đối với ai đó để làm gì','Đánh giá quan trọng, khó, dễ…','It is + adjective + for O + to V','It is important for companies to listen to their customers.'],
[9,'Không còn nghi ngờ gì rằng …','Nhấn mạnh nhận định.','There is no doubt that + S + V','There is no doubt that technology plays an important role in modern life.'],
[10,'Một trong những lý do chính tại sao … là vì …','Triển khai nguyên nhân.','One of the main reasons why + S + V + is that + S + V','One of the main reasons why people prefer online shopping is that it saves time.'],
[11,'Càng … thì càng …','Hai thay đổi có quan hệ.','The more + clause, the more + clause','The more employees are trained, the more productive they become.'],
[12,'Không những … mà còn …','Hai lợi ích hoặc đặc điểm song song.','Not only + X + but also + Y','Working from home not only saves commuting time but also reduces transportation costs.'],
[13,'So với …','Mở đầu câu so sánh.','Compared with / to + N, S + V','Compared with traditional shopping, online shopping is more convenient.'],
[14,'Thay vì làm A, chọn / làm B','Nhấn mạnh lựa chọn B.','Rather than + V / V-ing, S + V','Rather than driving to work, employees can use public transportation.'],
[15,'Thay vì làm gì đó …','Instead of + noun/V-ing.','Instead of + V-ing / N, S + V','Instead of spending money on advertising, companies can invest in product quality.'],
[16,'Có xu hướng làm gì','Tránh khẳng định tuyệt đối.','S + tend(s) to + V','Younger consumers tend to shop online.'],
[17,'Có khả năng sẽ làm gì','Diễn đạt khả năng/xu hướng.','S + be likely to + V','Satisfied customers are likely to purchase from the company again.'],
[18,'Dẫn đến / gây ra …','Nguyên nhân → kết quả.','S + lead to / result in + N / V-ing','Long working hours can lead to stress.'],
[19,'…, điều mà / việc này …','Mệnh đề quan hệ bổ sung thông tin.','Main clause, which + V ...','The company introduced flexible working hours, which improved employee satisfaction.'],
[20,'Sau khi đã làm xong …, ai đó …','Perfect participle.','Having + V3, S + V','Having completed the training program, employees can perform their tasks more efficiently.']];
const D=['Despite + S + V, S + V','Although + N / V-ing, S + V','If + S + will V, S + V','Unless + S + will V, S + V','By + to V, S + can + V','S + allow + O + V-ing','S + make + O + to V','It is + adjective + O + V','There has no doubt that + S + V','One of the main reason + S + V','The more + adjective, the most + adjective','Not only + X + and also + Y','Compared + N, S + V','Rather than + to V, S + V','Instead of + to V, S + V','S + tend + V-ing','S + be likely + V-ing','S + lead / result + N','Main clause, what + V ...','Having + V2, S + V'];
const $=x=>document.getElementById(x),sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let d=JSON.parse(localStorage.gpgpro||'null')||{c:0,w:0,s:0,b:0,m:[],e:[],p:{},sound:true},A=[],i=0,score=0,lock=false,mode='all';function ps(id){return d.p[id]||(d.p[id]={c:0,w:0})}function acc(id){let x=ps(id),t=x.c+x.w;return t?x.c/t:null}function save(){localStorage.gpgpro=JSON.stringify(d);topstats()}function topstats(){let t=d.c+d.w;$('sc').textContent=d.c;$('sw').textContent=d.w;$('sa').textContent=t?Math.round(d.c/t*100)+'%':'0%';$('ss').textContent=d.s;$('sm').textContent=d.m.length;$('sound').textContent=d.sound?'🔊 Âm thanh':'🔇 Âm thanh'}function weak(){return P.filter(x=>{let z=ps(x[0]),t=z.c+z.w;return t&&(z.c/t<.75||z.w>=2)}).sort((a,b)=>(acc(a[0])??1)-(acc(b[0])??1))}function start(m='all'){mode=m;if(m==='all')A=[...P].sort((a,b)=>(acc(a[0])??.55)-(acc(b[0])??.55));if(m==='wrong'){let ids=[...new Set(d.e.map(x=>x.id))];A=sh(P.filter(x=>ids.includes(x[0])))}if(m==='weak')A=weak();if(m==='marked')A=sh(P.filter(x=>d.m.includes(x[0])));if(!A.length){alert('Chưa có dữ liệu cho chế độ này.');mode='all';A=sh(P)}i=score=0;lock=false;$('qb').style.display='block';$('result').style.display='none';render()}function render(){if(i>=A.length)return done();let q=A[i];lock=false;$('bar').style.width=i/A.length*100+'%';$('count').textContent=(i+1)+' / '+A.length;$('meaning').textContent=q[1];$('hint').textContent=q[2];$('fb').classList.remove('on');$('next').style.display='none';$('mark').textContent=d.m.includes(q[0])?'★':'☆';$('mark').classList.toggle('on',d.m.includes(q[0]));let opts=sh([q[3],...sh(D.filter(x=>x!==q[3])).slice(0,3)]);$('opts').innerHTML='';opts.forEach((x,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=(n+1)+'. '+x;b.onclick=()=>answer(x,b);$('opts').appendChild(b)})}function answer(x,b){if(lock)return;lock=true;let q=A[i],ok=x===q[3],z=ps(q[0]);[...$('opts').children].forEach(v=>{v.disabled=true;if(v.textContent.slice(3)===q[3])v.classList.add('ok')});if(ok){d.c++;d.s++;z.c++;score++;$('fbt').textContent='✓ Chính xác';$('fbt').style.color='var(--g)';beep(620);if(d.s%5===0)conf(20)}else{d.w++;d.s=0;z.w++;b.classList.add('bad');d.e.unshift({id:q[0],sel:x,cor:q[3],time:Date.now()});d.e=d.e.slice(0,150);$('fbt').textContent='✗ Sai — đã lưu vào Sổ lỗi';$('fbt').style.color='var(--r)';beep(170)}$('formula').textContent=q[3];$('example').textContent='Ví dụ: '+q[4];$('fb').classList.add('on');$('next').style.display='block';$('bar').style.width=(i+1)/A.length*100+'%';save()}function done(){$('qb').style.display='none';$('result').style.display='block';$('score').textContent=score+'/'+A.length;let p=Math.round(score/A.length*100);$('note').textContent=p>=85?'Rất tốt. Pattern khá chắc.':p>=70?'Khá ổn. Nên ôn lại câu sai.':'Nên ưu tiên câu sai và cấu trúc yếu.';if(p>=80)conf(60)}function toggle(){let id=A[i][0];d.m=d.m.includes(id)?d.m.filter(x=>x!==id):[...d.m,id];save();renderMarks();render()}function beep(f){if(!d.sound)return;try{let C=window.AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.07;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.2)}catch(e){}}function conf(n){let col=['#5b5cf0','#8b5cf6','#f59e0b','#22c55e','#06b6d4'];for(let k=0;k<n;k++){let c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=col[k%col.length];c.style.setProperty('--x',(Math.random()*250-125)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),1900)}}function renderErrors(){if(!d.e.length)return $('errorList').innerHTML='<div class="empty">Chưa có lỗi sai.</div>';$('errorList').innerHTML='<div class="list">'+d.e.map(e=>{let q=P.find(x=>x[0]===e.id);return `<div class="item"><b>#${e.id} — ${q?q[1]:''}</b><small><span class="badtext">Bạn chọn: ${e.sel}</span><br><span class="goodtext">Đúng: ${e.cor}</span></small></div>`}).join('')+'</div>'}function renderStats(){$('st').innerHTML=P.map(q=>{let z=ps(q[0]),t=z.c+z.w,a=t?Math.round(z.c/t*100)+'%':'—';return `<tr><td>${q[0]}</td><td>${q[1]}<br><small>${q[3]}</small></td><td>${z.c}</td><td>${z.w}</td><td><b>${a}</b></td></tr>`}).join('')}function renderMarks(){let a=P.filter(q=>d.m.includes(q[0]));$('markList').innerHTML=a.length?'<div class="list">'+a.map(q=>`<div class="item"><b>#${q[0]} — ${q[1]}</b><small>${q[3]}<br>${q[4]}</small></div>`).join('')+'</div>':'<div class="empty">Chưa đánh dấu cấu trúc nào.</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on');renderErrors();renderStats();renderMarks()});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));$('next').onclick=()=>{i++;render()};$('skip').onclick=()=>{i++;render()};$('mark').onclick=toggle;$('again').onclick=()=>start(mode);$('sound').onclick=()=>{d.sound=!d.sound;save();if(d.sound)beep(600)};$('clear').onclick=()=>{if(confirm('Xóa toàn bộ lịch sử lỗi?')){d.e=[];save();renderErrors()}};document.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)&&!lock){let b=$('opts').children[+e.key-1];if(b)b.click()}else if(e.key==='Enter'&&lock)$('next').click();else if(e.key.toLowerCase()==='m'&&A[i])toggle()});topstats();start();</script></body></html>
